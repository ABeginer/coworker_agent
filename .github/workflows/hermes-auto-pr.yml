name: Auto PR for Hermes Edits

on:
  push:
    branches:
      - 'hermes-edit/**'

jobs:
  create-pr:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check Existing and Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH_NAME="${{ github.ref_name }}"
          
          # Kiểm tra nếu PR đã tồn tại thì không tạo trùng lặp
          EXISTING_PR=$(gh pr list --head "$BRANCH_NAME" --base main --json number --jq '.[0].number')

          if [ -n "$EXISTING_PR" ]; then
            echo "Pull request already exists: #$EXISTING_PR"
            exit 0
          fi

          PR_TITLE=$(git log -1 --pretty=%s)

          gh pr create \
            --base main \
            --head "$BRANCH_NAME" \
            --title "$PR_TITLE" \
            --body "### Summary
          Automated Pull Request generated for branch \`$BRANCH_NAME\`.

          - **Author**: Hermes Agent
          - **Trigger**: Automated branch push
          
          Please review the diff and verify before merging."
